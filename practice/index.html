<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOEFL Practice</title><style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#111827;--muted:#667085;--line:#d9dee7;--blue:#1d4ed8;--green:#15803d;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif}
.app{max-width:820px;margin:0 auto;padding:18px 14px 36px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
h1,h2,h3{margin-top:0}button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
button.secondary{background:#eef2f7;color:#24324a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.module{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.small{font-size:13px}
.option{display:block;border:1px solid var(--line);padding:10px;border-radius:12px;margin:7px 0}.stim{white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:12px;line-height:1.55}
.blank{font:inherit;border:0;border-bottom:2px solid #111;background:#fff;text-align:center;outline:none}.answerline{min-height:48px;border:1px solid var(--line);padding:12px;border-radius:12px;margin:10px 0}
.chip{background:#eaf0ff;color:#1d2a44;margin:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.score{font-size:42px;font-weight:900}.ok{color:var(--green)}.bad{color:var(--red)}
.review{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}.review-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fff}.review-row.correct{border-color:#bbf7d0;background:#f0fdf4}.review-row.incorrect{border-color:#fecaca;background:#fff7f7}
.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;background:#eef2f7;color:#24324a}.pill.done{background:#dcfce7;color:#166534}.pill.new{background:#dbeafe;color:#1d4ed8}
textarea{width:100%;min-height:160px;padding:12px;font:inherit;border:1px solid var(--line);border-radius:12px}.audio{padding:12px;background:#f8fafc;border-radius:12px;margin:10px 0}
</style></head>
<body><div class="app"><h1>TOEFL Practice</h1><p class="muted">Objective modules only. Questions load from <code>../data/questions.json</code>.</p><div id="root"></div></div>
<script>
let Q={},voices=[],selectedVoices={},audioPlaying=false;
function getJSON(path){return fetch(`${path}?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json())}
getJSON('../data/questions.json').then(x=>{Q=x;home()});

const mods=[['complete_words','Complete the Words'],['daily_life','Read in Daily Life'],['academic_passage','Academic Passage'],['choose_response','Choose a Response'],['conversations','Conversation'],['announcements','Announcement'],['academic_talks','Academic Talk'],['build_sentence','Build a Sentence']];
let st={};
function root(h){document.getElementById('root').innerHTML=h;scrollTo(0,0)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function solvedKey(){return 'toeflPracticeSolved.v1'}function solvedMap(){try{return JSON.parse(localStorage.getItem(solvedKey())||'{}')}catch(e){return {}}}function saveSolved(m){localStorage.setItem(solvedKey(),JSON.stringify(m))}function isSolved(type,id){let m=solvedMap();return !!(m[type]&&m[type][id])}function markSolved(type,id){let m=solvedMap();m[type]=m[type]||{};m[type][id]=new Date().toISOString();saveSolved(m)}function solvedCount(type){return Q[type].filter(x=>isSolved(type,x.id)).length}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function clearProgress(){if(confirm('Clear all practice progress on this device?')){localStorage.removeItem(solvedKey());home()}}
function home(){root('<div class="card toolbar"><button class="secondary" onclick="testVoice(this)">Test Voice</button><button class="secondary" onclick="clearProgress()">Reset Progress</button></div><div class="grid">'+mods.map(m=>{let done=solvedCount(m[0]),total=Q[m[0]].length;return `<button class="module" onclick="start('${m[0]}')"><b>${m[1]}</b><div class="small muted">${total} item(s)</div><div class="small"><span class="pill ${done===total?'done':'new'}">${done}/${total} solved</span></div></button>`}).join('')+'</div>')}
function start(type){let unsolved=[],solved=[];Q[type].forEach((x,i)=>(isSolved(type,x.id)?solved:unsolved).push(i));st={type,idx:0,score:0,total:0,order:[...shuffle(unsolved),...shuffle(solved)]};render()}
function next(){st.idx++; if(st.idx>=st.order.length)finish(); else render()}
function render(){let item=Q[st.type][st.order[st.idx]]; if(st.type==='complete_words')return cw(item);if(st.type==='build_sentence')return bs(item);if(st.type==='choose_response')return cr(item);return mc(item)}
function statusLine(it){return `<div class="small muted"><span class="pill ${isSolved(st.type,it.id)?'done':'new'}">${isSolved(st.type,it.id)?'Solved before':'New'}</span> Question ${st.idx+1}/${st.order.length} · ${esc(it.id)}</div>`}
function cw(it){let i=0,b=it.text.replace(/([A-Za-z]+)(_+)/g,(m,p,u)=>`${p}<input class="blank" id="b${i++}" maxlength="${u.length}" style="width:${Math.max(28,u.length*14)}px">`);root(`<div class="card">${statusLine(it)}<h2>${esc(it.title)}</h2><p style="line-height:2">${b}</p><button onclick="checkCW()">Check</button></div>`)}
function cwBlanks(it){let out=[];it.text.replace(/([A-Za-z]+)(_+)/g,(m,p,u)=>{out.push({prefix:p,underscores:u.length})});return out}
function checkCW(){let it=Q[st.type][st.order[st.idx]],s=0,rows=[],blanks=cwBlanks(it);it.answers.forEach((a,i)=>{let given=(document.getElementById('b'+i).value||'').trim(),ok=given.toLowerCase()===a.toLowerCase(),prefix=blanks[i]?blanks[i].prefix:'';if(ok)s++;rows.push(`<div class="review-row ${ok?'correct':'incorrect'}"><b>Blank ${i+1}: <span class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</span></b><div>Visible prefix: <b>${esc(prefix)}</b></div><div>Your answer: ${esc(given||'—')} <span class="muted">(${esc(prefix+given)})</span></div><div>Correct answer: <b>${esc(prefix+a)}</b> <span class="muted">(missing letters: ${esc(a)})</span></div></div>`)});markSolved(st.type,it.id);st.score+=s;st.total+=it.answers.length;root(`<div class="card"><div class="score">${s}/${it.answers.length}</div><div class="review">${rows.join('')}</div><button onclick="next()">Next</button></div>`)}
function bs(it){let order=[...it.parts.keys()].sort(()=>Math.random()-.5);st.sel=[];root(`<div class="card">${statusLine(it)}<h2>Build a Sentence</h2><p class="small muted">Click a block to add it. Click a selected block, Undo Last, or Clear to remove it.</p><div>${order.map(i=>`<button class="chip" data-part-index="${i}" onclick="selPart(${i},this)">${esc(it.parts[i])}</button>`).join('')}</div><div id="line" class="answerline"></div><div class="toolbar"><button class="secondary" onclick="undoBS()">Undo Last</button><button class="secondary" onclick="clearBS()">Clear</button><button onclick="checkBS()">Check</button></div></div>`);drawBSLine()}
function selPart(i,b){if(st.sel.includes(i))return;st.sel.push(i);b.disabled=true;drawBSLine()}
function setPartEnabled(i,enabled){document.querySelectorAll('.chip[data-part-index]').forEach(b=>{if(+b.dataset.partIndex===i)b.disabled=!enabled})}
function unselectPartAt(pos){let [i]=st.sel.splice(pos,1);setPartEnabled(i,true);drawBSLine()}
function undoBS(){if(!st.sel.length)return;unselectPartAt(st.sel.length-1)}
function clearBS(){while(st.sel.length)unselectPartAt(st.sel.length-1)}
function drawBSLine(){let it=Q[st.type][st.order[st.idx]],line=document.getElementById('line');line.innerHTML=st.sel.length?st.sel.map((i,pos)=>`<button type="button" class="chip" onclick="unselectPartAt(${pos})">${esc(it.parts[i])} ×</button>`).join(' '):'<span class="muted small">Your answer will appear here.</span>'}
function checkBS(){let it=Q[st.type][st.order[st.idx]],ok=JSON.stringify(st.sel)===JSON.stringify([...it.parts.keys()]);markSolved(st.type,it.id);st.score+=ok?1:0;st.total++;root(`<div class="card"><div class="score">${ok?'1/1':'0/1'}</div><p>${ok?'Correct':esc(it.parts.join(' '))}</p><button onclick="next()">Next</button></div>`)}
function speechBtn(label,text,profile){return `<button class="play" data-speech="${esc(encodeURIComponent(text))}" onclick="speakFromButton(this,'${profile}')">${label}</button>`}
function cr(it){root(`<div class="card">${statusLine(it)}<h2>Listen and Choose a Response</h2>${speechBtn('▶ Play once',it.prompt,'choose')}${it.options.map((o,i)=>`<label class="option"><input type="radio" name="x" value="${i}">${esc(o)}</label>`).join('')}<button onclick="checkCR()">Check</button></div>`)}
function checkCR(){let it=Q[st.type][st.order[st.idx]],x=document.querySelector('input[name=x]:checked'),picked=x?+x.value:null,ok=picked===it.answer;markSolved(st.type,it.id);st.score+=ok?1:0;st.total++;root(`<div class="card"><div class="score">${ok?'1/1':'0/1'}</div><div class="review-row ${ok?'correct':'incorrect'}"><b class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</b><div>Your answer: ${picked===null?'—':esc(it.options[picked])}</div><div>Correct answer: <b>${esc(it.options[it.answer])}</b></div></div><button onclick="next()">Next</button></div>`)}
function mc(it){let text=it.text||'',profile=st.type==='announcements'?'announcement':'lecturer';if(it.turns)text=it.turns.map(t=>t.join(': ')).join('\n');let topAudio=st.type==='conversations'?`<button class="play" onclick="speakConversation(${st.order[st.idx]},this)">▶ Play once</button>`:st.type.includes('talk')?speechBtn('▶ Play once',text,profile):st.type==='announcements'?'':`<div class="stim">${esc(text)}</div>`;root(`<div class="card">${statusLine(it)}<h2>${esc(it.title||st.type)}</h2>${topAudio}${it.questions.map((q,qi)=>`<div>${st.type==='announcements'?speechBtn('▶ Play question '+(qi+1),text,profile):''}<b>${esc(q.q)}</b>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="q${qi}" value="${i}">${esc(o)}</label>`).join('')}</div>`).join('')}<button onclick="checkMC()">Check</button></div>`)}
function checkMC(){let it=Q[st.type][st.order[st.idx]],s=0,rows=[];it.questions.forEach((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`),picked=x?+x.value:null,ok=picked===q.answer;if(ok)s++;rows.push(`<div class="review-row ${ok?'correct':'incorrect'}"><b>Question ${i+1}: <span class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</span></b><div>${esc(q.q)}</div><div>Your answer: ${picked===null?'—':esc(q.options[picked])}</div><div>Correct answer: <b>${esc(q.options[q.answer])}</b></div></div>`)});markSolved(st.type,it.id);st.score+=s;st.total+=it.questions.length;root(`<div class="card"><div class="score">${s}/${it.questions.length}</div><div class="review">${rows.join('')}</div><button onclick="next()">Next</button></div>`)}
function finish(){root(`<div class="card"><div class="score">${st.score}/${st.total}</div><button onclick="home()">Home</button></div>`)}
function refreshVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));let female=['Ava','Samantha','Allison','Zoe','Susan'],male=['Evan','Aaron','Tom','Daniel'],student=pickVoice(female),staff=pickVoice(male),lecturer=pickVoice(male,[staff]),interview=pickVoice(male,[staff,lecturer]);selectedVoices={studentVoice:student,staffVoice:staff,lecturerVoice:lecturer||staff,announcementVoice:pickVoice([...female,...male]),repeatVoice:pickVoice(female),interviewVoice:interview||pickVoice(male)};console.log('studentVoice',selectedVoices.studentVoice&&selectedVoices.studentVoice.name);console.log('staffVoice',selectedVoices.staffVoice&&selectedVoices.staffVoice.name);console.log('lecturerVoice',selectedVoices.lecturerVoice&&selectedVoices.lecturerVoice.name);console.log('announcementVoice',selectedVoices.announcementVoice&&selectedVoices.announcementVoice.name);console.log('repeatVoice',selectedVoices.repeatVoice&&selectedVoices.repeatVoice.name)}
function pickVoice(names,exclude=[]){let skip=new Set(exclude.filter(Boolean).map(v=>v.name)),us=voices.filter(v=>/en[-_]US/i.test(v.lang)),pool=(us.length?us:voices).filter(v=>!skip.has(v.name));if(!pool.length)pool=us.length?us:voices;let rank=v=>{let i=names.findIndex(n=>v.name.toLowerCase().includes(n.toLowerCase()));return (v.localService?0:100)+(i<0?50:i)};return [...pool].sort((a,b)=>rank(a)-rank(b))[0]||null}
function voiceFor(profile,speaker){if(speaker&&/^student$/i.test(speaker))return selectedVoices.studentVoice;if(speaker&&/(advisor|professor|staff|librarian)/i.test(speaker))return selectedVoices.staffVoice;return ({choose:selectedVoices.announcementVoice,announcement:selectedVoices.announcementVoice,lecturer:selectedVoices.lecturerVoice,repeat:selectedVoices.repeatVoice,interview:selectedVoices.interviewVoice,student:selectedVoices.studentVoice,staff:selectedVoices.staffVoice}[profile])||pickVoice([])}
function rateFor(profile){return {announcement:.98,lecturer:.96,repeat:.98,interview:.98,choose:1,student:.98,staff:.97}[profile]||1}
function setPlayDisabled(disabled,except){document.querySelectorAll('button.play').forEach(x=>{if(x!==except&&!x.dataset.used)x.disabled=disabled})}
function speakFromButton(b,profile='choose'){speak(b.dataset.speech,b,profile)}
function speak(enc,b,profile='choose'){if(b.dataset.used||audioPlaying)return;b.dataset.used=1;b.disabled=true;playUtterance(decodeURIComponent(enc),voiceFor(profile),rateFor(profile),()=>{},()=>{})}
function playUtterance(text,voice,rate,onend,onerror){audioPlaying=true;setPlayDisabled(true);speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;u.onend=()=>{audioPlaying=false;setPlayDisabled(false);onend&&onend()};u.onerror=()=>{audioPlaying=false;setPlayDisabled(false);onerror&&onerror()};speechSynthesis.speak(u)}
function speakConversation(itemIndex,b){if(b.dataset.used||audioPlaying)return;b.dataset.used=1;b.disabled=true;let turns=Q.conversations[itemIndex].turns,i=0;let next=()=>{if(i>=turns.length)return;let [speaker,text]=turns[i++],profile=/^student$/i.test(speaker)?'student':'staff';playUtterance(`${speaker}. ${text}`,voiceFor(profile,speaker),rateFor(profile),next,next)};next()}
function testVoice(b){if(audioPlaying)return;b.disabled=true;playUtterance('This is a natural American English voice test for the TOEFL listening system.',voiceFor('repeat'),rateFor('repeat'),()=>b.disabled=false,()=>b.disabled=false)}
refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices;
</script></body></html>
