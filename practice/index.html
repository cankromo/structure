<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOEFL Practice</title><style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#111827;--muted:#667085;--line:#d9dee7;--blue:#1d4ed8;--green:#15803d;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif}
.app{max-width:820px;margin:0 auto;padding:18px 14px 36px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
h1,h2,h3{margin-top:0}button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
button.secondary{background:#eef2f7;color:#24324a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.module{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.small{font-size:13px}
.option{display:block;border:1px solid var(--line);padding:10px;border-radius:12px;margin:7px 0}.stim{white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:12px;line-height:1.55}
.blank{font:inherit;border:0;border-bottom:2px solid #111;background:#fff;text-align:center;outline:none}.answerline{min-height:48px;border:1px solid var(--line);padding:12px;border-radius:12px;margin:10px 0}
.chip{background:#eaf0ff;color:#1d2a44;margin:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.score{font-size:42px;font-weight:900}.ok{color:var(--green)}.bad{color:var(--red)}
.review{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}.review-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fff}.review-row.correct{border-color:#bbf7d0;background:#f0fdf4}.review-row.incorrect{border-color:#fecaca;background:#fff7f7}
.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;background:#eef2f7;color:#24324a}.pill.done{background:#dcfce7;color:#166534}.pill.new{background:#dbeafe;color:#1d4ed8}
textarea{width:100%;min-height:160px;padding:12px;font:inherit;border:1px solid var(--line);border-radius:12px}.audio{padding:12px;background:#f8fafc;border-radius:12px;margin:10px 0}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head>
<body><div class="app"><h1>TOEFL Practice</h1><p class="muted">Questions load from <code>../data/questions.json</code>.</p><div id="root"></div></div>
<script>
let Q={},voices=[],selectedVoices={},audioPlaying=false,practiceAnswers={writing:{},speaking:{}},practiceRecordings={},practiceStream=null;
function getJSON(path){return fetch(`${path}?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json())}
getJSON('../data/questions.json').then(x=>{Q=x;home()});

const mods=[['complete_words','Complete the Words'],['daily_life','Read in Daily Life'],['academic_passage','Academic Passage'],['choose_response','Listen and Choose a Response'],['conversations','Listen to a Conversation'],['announcements','Listen to an Announcement'],['academic_talks','Listen to an Academic Talk'],['build_sentence','Build a Sentence'],['email','Write an Email'],['discussion','Write for an Academic Discussion'],['repeat','Listen and Repeat'],['interview','Take an Interview']];
let st={};
function root(h){document.getElementById('root').innerHTML=h;scrollTo(0,0)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function solvedKey(){return 'toeflPracticeSolved.v1'}function solvedMap(){try{return JSON.parse(localStorage.getItem(solvedKey())||'{}')}catch(e){return {}}}function saveSolved(m){localStorage.setItem(solvedKey(),JSON.stringify(m))}function isSolved(type,id){let m=solvedMap();return !!(m[type]&&m[type][id])}function markSolved(type,id){let m=solvedMap();m[type]=m[type]||{};m[type][id]=new Date().toISOString();saveSolved(m)}function solvedCount(type){return Q[type].filter(x=>isSolved(type,x.id)).length}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function clearProgress(){if(confirm('Clear all practice progress on this device?')){localStorage.removeItem(solvedKey());home()}}
function home(){root('<div class="card toolbar"><button class="secondary" onclick="testVoice(this)">Test Voice</button><button class="secondary" onclick="clearProgress()">Reset Progress</button><button class="secondary" onclick="exportPracticeZip()">Export for ChatGPT</button></div><div class="grid">'+mods.map(m=>{let done=solvedCount(m[0]),total=Q[m[0]].length;return `<button class="module" onclick="start('${m[0]}')"><b>${m[1]}</b><div class="small muted">${total} item(s)</div><div class="small"><span class="pill ${done===total?'done':'new'}">${done}/${total} solved</span></div></button>`}).join('')+'</div>')}
function start(type){if(type==='repeat')return startRepeat();let unsolved=[],solved=[];Q[type].forEach((x,i)=>(isSolved(type,x.id)?solved:unsolved).push(i));st={type,idx:0,score:0,total:0,order:[...shuffle(unsolved),...shuffle(solved)]};render()}
function startRepeat(){let groups={};Q.repeat.forEach((x,i)=>{let g=x.scenario_id||x.id;(groups[g]=groups[g]||[]).push(i)});let all=Object.values(groups).map(g=>g.sort((a,b)=>(Q.repeat[a].sequence||1)-(Q.repeat[b].sequence||1))),unsolved=all.filter(g=>g.some(i=>!isSolved('repeat',Q.repeat[i].id))),solved=all.filter(g=>g.every(i=>isSolved('repeat',Q.repeat[i].id)));st={type:'repeat',idx:0,score:0,total:0,order:[...shuffle(unsolved),...shuffle(solved)].flat()};render()}
function next(){st.idx++; if(st.idx>=st.order.length)finish(); else render()}
function render(){let item=Q[st.type][st.order[st.idx]]; if(st.type==='complete_words')return cw(item);if(st.type==='build_sentence')return bs(item);if(st.type==='choose_response')return cr(item);if(st.type==='email'||st.type==='discussion')return writingPractice(item);if(st.type==='repeat')return repeatPractice(item);if(st.type==='interview')return interviewPractice(item);return mc(item)}
function statusLine(it){return `<div class="small muted"><span class="pill ${isSolved(st.type,it.id)?'done':'new'}">${isSolved(st.type,it.id)?'Solved before':'New'}</span> Question ${st.idx+1}/${st.order.length} · ${esc(it.id)}</div>`}
function cw(it){let i=0,b=it.text.replace(/([A-Za-z]+)(_+)/g,(m,p,u)=>`${p}<input class="blank" id="b${i++}" maxlength="${u.length}" style="width:${Math.max(28,u.length*14)}px">`);root(`<div class="card">${statusLine(it)}<h2>${esc(it.title)}</h2><p style="line-height:2">${b}</p><button onclick="checkCW()">Check</button></div>`)}
function cwBlanks(it){let out=[];it.text.replace(/([A-Za-z]+)(_+)/g,(m,p,u)=>{out.push({prefix:p,underscores:u.length})});return out}
function checkCW(){let it=Q[st.type][st.order[st.idx]],s=0,rows=[],blanks=cwBlanks(it);it.answers.forEach((a,i)=>{let given=(document.getElementById('b'+i).value||'').trim(),ok=given.toLowerCase()===a.toLowerCase(),prefix=blanks[i]?blanks[i].prefix:'';if(ok)s++;rows.push(`<div class="review-row ${ok?'correct':'incorrect'}"><b>Blank ${i+1}: <span class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</span></b><div>Visible prefix: <b>${esc(prefix)}</b></div><div>Your answer: ${esc(given||'—')} <span class="muted">(${esc(prefix+given)})</span></div><div>Correct answer: <b>${esc(prefix+a)}</b> <span class="muted">(missing letters: ${esc(a)})</span></div></div>`)});markSolved(st.type,it.id);st.score+=s;st.total+=it.answers.length;root(`<div class="card"><div class="score">${s}/${it.answers.length}</div><div class="review">${rows.join('')}</div><button onclick="next()">Next</button></div>`)}
function bs(it){let order=[...it.parts.keys()].sort(()=>Math.random()-.5);st.sel=[];root(`<div class="card">${statusLine(it)}<h2>Build a Sentence</h2><p class="small muted">Click a block to add it. Click a selected block, Undo Last, or Clear to remove it.</p><div>${order.map(i=>`<button class="chip" data-part-index="${i}" onclick="selPart(${i},this)">${esc(it.parts[i])}</button>`).join('')}</div><div id="line" class="answerline"></div><div class="toolbar"><button class="secondary" onclick="undoBS()">Undo Last</button><button class="secondary" onclick="clearBS()">Clear</button><button onclick="checkBS()">Check</button></div></div>`);drawBSLine()}
function selPart(i,b){if(st.sel.includes(i))return;st.sel.push(i);b.disabled=true;drawBSLine()}
function setPartEnabled(i,enabled){document.querySelectorAll('.chip[data-part-index]').forEach(b=>{if(+b.dataset.partIndex===i)b.disabled=!enabled})}
function unselectPartAt(pos){let [i]=st.sel.splice(pos,1);setPartEnabled(i,true);drawBSLine()}
function undoBS(){if(!st.sel.length)return;unselectPartAt(st.sel.length-1)}
function clearBS(){while(st.sel.length)unselectPartAt(st.sel.length-1)}
function drawBSLine(){let it=Q[st.type][st.order[st.idx]],line=document.getElementById('line');line.innerHTML=st.sel.length?st.sel.map((i,pos)=>`<button type="button" class="chip" onclick="unselectPartAt(${pos})">${esc(it.parts[i])} ×</button>`).join(' '):'<span class="muted small">Your answer will appear here.</span>'}
function checkBS(){let it=Q[st.type][st.order[st.idx]],ok=JSON.stringify(st.sel)===JSON.stringify([...it.parts.keys()]);markSolved(st.type,it.id);st.score+=ok?1:0;st.total++;root(`<div class="card"><div class="score">${ok?'1/1':'0/1'}</div><p>${ok?'Correct':esc(it.parts.join(' '))}</p><button onclick="next()">Next</button></div>`)}
function speechBtn(label,text,profile){return `<button class="play" data-speech="${esc(encodeURIComponent(text))}" onclick="speakFromButton(this,'${profile}')">${label}</button>`}
function cr(it){root(`<div class="card">${statusLine(it)}<h2>Listen and Choose a Response</h2>${speechBtn('▶ Play once',it.prompt,'choose')}${it.options.map((o,i)=>`<label class="option"><input type="radio" name="x" value="${i}">${esc(o)}</label>`).join('')}<button onclick="checkCR()">Check</button></div>`)}
function checkCR(){let it=Q[st.type][st.order[st.idx]],x=document.querySelector('input[name=x]:checked'),picked=x?+x.value:null,ok=picked===it.answer;markSolved(st.type,it.id);st.score+=ok?1:0;st.total++;root(`<div class="card"><div class="score">${ok?'1/1':'0/1'}</div><div class="review-row ${ok?'correct':'incorrect'}"><b class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</b><div>Your answer: ${picked===null?'—':esc(it.options[picked])}</div><div>Correct answer: <b>${esc(it.options[it.answer])}</b></div></div><button onclick="next()">Next</button></div>`)}
function mc(it){let text=it.text||'',profile=st.type==='announcements'?'announcement':'lecturer';if(it.turns)text=it.turns.map(t=>t.join(': ')).join('\n');let topAudio=st.type==='conversations'||st.type==='announcements'||st.type==='academic_talks'?'':`<div class="stim">${esc(text)}</div>`;root(`<div class="card">${statusLine(it)}<h2>${esc(it.title||st.type)}</h2>${topAudio}${it.questions.map((q,qi)=>`<div>${st.type==='announcements'||st.type==='academic_talks'?speechBtn('▶ Play question '+(qi+1),text,profile):st.type==='conversations'?`<button class="play" onclick="speakConversation(${st.order[st.idx]},this)">▶ Play question ${qi+1}</button>`:''}<b>${esc(q.q)}</b>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="q${qi}" value="${i}">${esc(o)}</label>`).join('')}</div>`).join('')}<button onclick="checkMC()">Check</button></div>`)}
function checkMC(){let it=Q[st.type][st.order[st.idx]],s=0,rows=[];it.questions.forEach((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`),picked=x?+x.value:null,ok=picked===q.answer;if(ok)s++;rows.push(`<div class="review-row ${ok?'correct':'incorrect'}"><b>Question ${i+1}: <span class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</span></b><div>${esc(q.q)}</div><div>Your answer: ${picked===null?'—':esc(q.options[picked])}</div><div>Correct answer: <b>${esc(q.options[q.answer])}</b></div></div>`)});markSolved(st.type,it.id);st.score+=s;st.total+=it.questions.length;root(`<div class="card"><div class="score">${s}/${it.questions.length}</div><div class="review">${rows.join('')}</div><button onclick="next()">Next</button></div>`)}
function writingPractice(it){let title=st.type==='email'?'Write an Email':'Write for an Academic Discussion',saved=practiceAnswers.writing[it.id]||'';root(`<div class="card">${statusLine(it)}<h2>${title}</h2><div class="stim">${esc(it.prompt)}</div><textarea id="writingAnswer" placeholder="Write your response here...">${esc(saved)}</textarea><div class="toolbar"><button onclick="saveFreePractice()">Mark Complete</button><button class="secondary" onclick="exportPracticeZip()">Export for ChatGPT</button><button class="secondary" onclick="next()">Skip</button></div></div>`)}
function repeatPractice(it){let ok=!!(window.SpeechRecognition||window.webkitSpeechRecognition),intro=it.sequence===1&&it.scenario_intro?`<div class="stim"><b>Scenario</b>\n${esc(it.scenario_intro)}</div>`:'';root(`<div class="card">${statusLine(it)}${intro}<h2>Listen and Repeat</h2><p class="muted">Sentence ${it.sequence||st.idx+1}${it.level?` · ${esc(it.level)}`:''}. Play the sentence once, then repeat it aloud. The transcript is hidden until after dictation.</p>${speechBtn('▶ Play once',it.text,'repeat')}<div class="toolbar"><button onclick="startRepeatDictation(this)" ${ok?'':'disabled'}>🎙 Start Dictation</button><button class="secondary" onclick="recordPractice('${it.id}',12,this)">● Record</button><button class="secondary" onclick="saveFreePractice()">Mark Complete</button><button class="secondary" onclick="exportPracticeZip()">Export for ChatGPT</button><button class="secondary" onclick="next()">Skip</button></div><div id="repeatResult" class="review">${ok?'':'<p class="bad">Speech recognition is not supported in this browser. Try Chrome.</p>'}</div></div>`)}
function interviewPractice(it){root(`<div class="card">${statusLine(it)}<h2>Take an Interview</h2><p class="muted">Play the question once, then answer aloud.</p>${speechBtn('▶ Play once',it.prompt,'interview')}<div class="stim">${esc(it.prompt)}</div><div class="toolbar"><button class="secondary" onclick="recordPractice('${it.id}',45,this)">● Record</button><button onclick="saveFreePractice()">Mark Complete</button><button class="secondary" onclick="exportPracticeZip()">Export for ChatGPT</button><button class="secondary" onclick="next()">Skip</button></div></div>`)}
function saveFreePractice(){let it=Q[st.type][st.order[st.idx]],w=document.getElementById('writingAnswer');if(w)practiceAnswers.writing[it.id]=w.value;if(st.type==='repeat'||st.type==='interview')practiceAnswers.speaking[it.id]={type:st.type,prompt:it.text||it.prompt,recorded:!!practiceRecordings[it.id]};markSolved(st.type,it.id);st.total++;st.score++;root(`<div class="card"><div class="score">Done</div><p class="muted">Marked complete for practice progress.</p><button onclick="next()">Next</button></div>`)}
async function recordPractice(id,sec,b){try{let it=Q[st.type][st.order[st.idx]];practiceAnswers.speaking[id]={type:st.type,prompt:it.text||it.prompt,recorded:true};practiceStream=await navigator.mediaDevices.getUserMedia({audio:true});let r=new MediaRecorder(practiceStream),chunks=[];r.ondataavailable=e=>chunks.push(e.data);r.onstop=()=>{practiceRecordings[id]=new Blob(chunks,{type:'audio/webm'});practiceStream.getTracks().forEach(t=>t.stop());b.textContent='Recorded ✓';b.disabled=true};r.start();b.textContent='Recording…';setTimeout(()=>r.stop(),sec*1000)}catch(e){alert(e.message)}}
function normWords(s){return String(s).toLowerCase().replace(/[^a-z0-9' ]+/g,' ').replace(/\\s+/g,' ').trim().split(' ').filter(Boolean)}
function editDistance(a,b){let dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)dp[i][0]=i;for(let j=0;j<=b.length;j++)dp[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[a.length][b.length]}
function repeatScore(target,spoken){let a=normWords(target),b=normWords(spoken);if(!a.length)return 0;let dist=editDistance(a,b),base=Math.max(a.length,b.length,1);return Math.max(0,Math.round((1-dist/base)*100))}
function startRepeatDictation(btn){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;let it=Q[st.type][st.order[st.idx]],box=document.getElementById('repeatResult'),rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;btn.disabled=true;box.innerHTML='<p class="muted">Listening... speak now.</p>';rec.onresult=e=>{let spoken=e.results[0][0].transcript,score=repeatScore(it.text,spoken),cls=score>=85?'ok':score>=65?'muted':'bad';markSolved(st.type,it.id);st.total++;st.score+=score>=70?1:0;box.innerHTML=`<div class="review-row ${score>=70?'correct':'incorrect'}"><div class="score ${cls}">${score}%</div><div><b>Target:</b> ${esc(it.text)}</div><div><b>Dictation:</b> ${esc(spoken)}</div><p class="small muted">Approximate score based on browser speech recognition word similarity.</p><button onclick="next()">Next</button></div>`};rec.onerror=e=>{btn.disabled=false;box.innerHTML=`<p class="bad">Dictation failed: ${esc(e.error||'unknown error')}</p>`};rec.onend=()=>{if(btn)btn.disabled=false};rec.start()}
function finish(){root(`<div class="card"><div class="score">${st.score}/${st.total}</div><button onclick="home()">Home</button></div>`)}
function refreshVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!isBadVoice(v));let female=['Ava','Samantha','Allison','Zoe','Susan','Nicky','Joelle','Karen','Tessa'],male=['Evan','Aaron','Tom','Daniel','Alex','Fred'],student=pickVoice(female),staff=pickVoice(male),lecturer=pickVoice(['Evan','Aaron','Tom','Daniel','Alex'],[staff]),interview=pickVoice(['Aaron','Evan','Daniel','Tom','Alex'],[staff,lecturer]);selectedVoices={studentVoice:student,staffVoice:staff,lecturerVoice:lecturer||staff,announcementVoice:pickVoice(['Ava','Samantha','Zoe','Nicky','Joelle','Allison','Karen',...male]),repeatVoice:pickVoice(['Ava','Samantha','Zoe','Nicky','Joelle','Allison','Susan']),interviewVoice:interview||pickVoice(male)};console.log('studentVoice',voiceName(selectedVoices.studentVoice));console.log('staffVoice',voiceName(selectedVoices.staffVoice));console.log('lecturerVoice',voiceName(selectedVoices.lecturerVoice));console.log('announcementVoice',voiceName(selectedVoices.announcementVoice));console.log('repeatVoice',voiceName(selectedVoices.repeatVoice))}
function voiceName(v){return v?`${v.name} (${v.lang}${v.localService?', local':''})`:'default'}
function isBadVoice(v){return /(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Junior|Kathy|Organ|Princess|Ralph|Trinoids|Whisper|Zarvox)/i.test(v.name)}
function pickVoice(names=[],exclude=[]){let skip=new Set(exclude.filter(Boolean).map(v=>v.name)),us=voices.filter(v=>/en[-_]US/i.test(v.lang)),pool=(us.length?us:voices).filter(v=>!skip.has(v.name));if(!pool.length)pool=us.length?us:voices;let rank=v=>{let n=v.name.toLowerCase(),i=names.findIndex(x=>n.includes(x.toLowerCase())),natural=/(enhanced|premium|neural|natural|google us english|siri)/i.test(v.name);return (i<0?100:i*2)+(v.localService?-12:0)+(/en[-_]US/i.test(v.lang)?-25:0)+(natural?-18:0)};return [...pool].sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name))[0]||null}
function voiceFor(profile,speaker){if(!voices.length)refreshVoices();if(speaker&&/^student$/i.test(speaker))return selectedVoices.studentVoice||pickVoice(['Ava','Samantha']);if(speaker&&/(advisor|professor|staff|librarian)/i.test(speaker))return selectedVoices.staffVoice||pickVoice(['Evan','Aaron','Tom']);return ({choose:selectedVoices.announcementVoice,announcement:selectedVoices.announcementVoice,lecturer:selectedVoices.lecturerVoice,repeat:selectedVoices.repeatVoice,interview:selectedVoices.interviewVoice,student:selectedVoices.studentVoice,staff:selectedVoices.staffVoice}[profile])||pickVoice(['Ava','Samantha','Google US English'])}
function rateFor(profile){return {announcement:.92,lecturer:.9,repeat:.93,interview:.93,choose:.95,student:.94,staff:.92}[profile]||.94}
function pitchFor(profile){return {student:1.04,repeat:1.02,announcement:1,choose:1,interview:.98,lecturer:.96,staff:.96}[profile]||1}
function cleanSpeechText(text){return String(text).replace(/\bCO2\b/g,'carbon dioxide').replace(/\bAI\b/g,'A I').replace(/\s+/g,' ').trim()}
function setPlayDisabled(disabled,except){document.querySelectorAll('button.play').forEach(x=>{if(x!==except&&!x.dataset.used)x.disabled=disabled})}
function speakFromButton(b,profile='choose'){speak(b.dataset.speech,b,profile)}
function speak(enc,b,profile='choose'){if(b.dataset.used||audioPlaying)return;b.dataset.used=1;b.disabled=true;playUtterance(decodeURIComponent(enc),voiceFor(profile),rateFor(profile),()=>{},()=>{},profile)}
function playUtterance(text,voice,rate,onend,onerror,profile='choose'){audioPlaying=true;setPlayDisabled(true);speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cleanSpeechText(text));u.lang=voice&&voice.lang?voice.lang:'en-US';if(voice)u.voice=voice;u.rate=rate;u.pitch=pitchFor(profile);u.volume=1;u.onend=()=>{audioPlaying=false;setPlayDisabled(false);onend&&onend()};u.onerror=()=>{audioPlaying=false;setPlayDisabled(false);onerror&&onerror()};speechSynthesis.speak(u)}
function speakConversation(itemIndex,b){if(b.dataset.used||audioPlaying)return;b.dataset.used=1;b.disabled=true;let turns=Q.conversations[itemIndex].turns,i=0;let next=()=>{if(i>=turns.length)return;let [speaker,text]=turns[i++],profile=/^student$/i.test(speaker)?'student':'staff';playUtterance(text,voiceFor(profile,speaker),rateFor(profile),next,next,profile)};next()}
function testVoice(b){if(audioPlaying)return;b.disabled=true;playUtterance('This is a natural American English voice test for the TOEFL listening system.',voiceFor('repeat'),rateFor('repeat'),()=>b.disabled=false,()=>b.disabled=false,'repeat')}
refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices;
function evaluationMd(){return `# Evaluate TOEFL Practice Responses\n\nPlease evaluate the attached TOEFL practice responses.\n\n## Writing\n\nFor each writing response, evaluate:\n- task fulfillment\n- organization\n- grammar and vocabulary\n- clarity and naturalness\n- estimated CEFR level\n- 2-3 concrete improvement suggestions\n\n## Speaking\n\nFor each speaking recording, evaluate:\n- pronunciation clarity\n- fluency and pacing\n- completeness of response\n- grammar and vocabulary when understandable\n- estimated TOEFL-style strengths and weaknesses\n- 2-3 concrete practice suggestions\n\nBe concise but specific. Do not invent content that is not audible or not provided.`}
async function exportPracticeZip(){let current=Q[st.type]&&Q[st.type][st.order&&st.order[st.idx]],w=document.getElementById('writingAnswer');if(current&&w)practiceAnswers.writing[current.id]=w.value;let zip=new JSZip(),meta={source:'TOEFL Practice',timestamp:new Date().toISOString(),writing_ids:Object.keys(practiceAnswers.writing),speaking_files:Object.keys(practiceRecordings).map(id=>'speaking/'+id+'.webm'),speaking:practiceAnswers.speaking};zip.file('practice_result.json',JSON.stringify(meta,null,2));zip.file('EVALUATE_WITH_CHATGPT.md',evaluationMd());for(let [id,text] of Object.entries(practiceAnswers.writing))zip.file('writing/'+id+'.txt',text||'');for(let [id,blob] of Object.entries(practiceRecordings))zip.file('speaking/'+id+'.webm',blob);let blob=await zip.generateAsync({type:'blob'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='toefl_practice_export.zip';a.click()}
