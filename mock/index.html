<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOEFL Full Mock</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#111827;--muted:#667085;--line:#d9dee7;--blue:#1d4ed8;--green:#15803d;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif}
.app{max-width:820px;margin:0 auto;padding:18px 14px 36px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
h1,h2,h3{margin-top:0}button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
button.secondary{background:#eef2f7;color:#24324a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.module{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.small{font-size:13px}
.timer{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#111827;color:#fff;border-radius:14px;padding:12px 14px;margin:0 0 14px}
.option{display:block;border:1px solid var(--line);padding:10px;border-radius:12px;margin:7px 0}.stim{white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:12px;line-height:1.55}
.blank{font:inherit;border:0;border-bottom:2px solid #111;background:#fff;text-align:center;outline:none}.answerline{min-height:48px;border:1px solid var(--line);padding:12px;border-radius:12px;margin:10px 0}
.chip{background:#eaf0ff;color:#1d2a44;margin:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.score{font-size:42px;font-weight:900}.ok{color:var(--green)}.bad{color:var(--red)}
textarea{width:100%;min-height:160px;padding:12px;font:inherit;border:1px solid var(--line);border-radius:12px}.audio{padding:12px;background:#f8fafc;border-radius:12px;margin:10px 0}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head>
<body><div class="app"><h1>TOEFL Full Mock</h1><p class="muted">Reading/Listening auto-score; Writing and Speaking are exported for ChatGPT evaluation.</p><div id="root"></div></div>
<script>
let Q,T,test,answers={objective:{},writing:{},speaking:{}},recordings={},stream=null,timer=null,deadline=0,activeSection='',completed={},seq=[],idx=0,secName='',currentItem=null,writingStep='build',voices=[],selectedVoices={},audioPlaying=false;
const sectionOrder=['reading','listening','writing','speaking'];
function getJSON(path){return fetch(`${path}?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json())}
Promise.all([getJSON('../data/questions.json'),getJSON('../data/tests.json')]).then(([q,t])=>{Q=q;T=t;home()})
function root(h){document.getElementById('root').innerHTML=(deadline?`<div class="timer"><b>${label(activeSection)}</b><span id="clock">--:--</span></div>`:'')+h;tick();scrollTo(0,0)}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function label(s){return ({reading:'Reading',listening:'Listening',writing:'Writing',speaking:'Speaking'}[s]||s)}
function minutes(s){return test&&test.durations?test.durations[s]:0}
function timeText(m){return m?`${m} min`:'No time limit'}
function totalTime(t){return Object.values(t.durations||{}).reduce((a,b)=>a+b,0)}
function home(){clearSectionTimer();root(`<div class="card"><button class="secondary" onclick="testVoice(this)">Test Voice</button></div><div class="grid">${T.tests.map(x=>`<button class="module" onclick="start('${x.id}')"><b>${x.name}</b><div class="small muted">Full mock${x.durations?` · ${totalTime(x)} min`:''}</div></button>`).join('')}</div>`)}
function find(type,id){return Q[type].find(x=>x.id===id)}
function missingRefs(t){return Object.values(t.sections).flatMap(groups=>groups.flatMap(g=>g.ids.filter(id=>!find(g.type,id)).map(id=>`${g.type}:${id}`)))}
function start(id){test=T.tests.find(x=>x.id===id);let missing=missingRefs(test);if(missing.length)return root(`<div class="card"><h2>${test.name}</h2><p class="bad">This mock cannot start because some question data is missing. Refresh the page after deployment finishes.</p><p class="small muted">${esc(missing.slice(0,12).join(', '))}${missing.length>12?'...':''}</p><button onclick="home()">Back</button></div>`);answers={objective:{},writing:{},speaking:{}};recordings={};completed={};currentItem=null;renderOverview()}
function sectionItems(sec){return test.sections[sec].reduce((sum,g)=>sum+g.ids.reduce((n,id)=>n+itemCount(g.type,find(g.type,id)),0),0)}
function itemCount(type,it){if(type==='complete_words')return it.answers.length;if(['daily_life','academic_passage','conversations','announcements','academic_talks'].includes(type))return it.questions.length;return 1}
function sectionButton(sec,i){let done=completed[sec]?' ✓':'';return `<button onclick="${sec==='writing'?'runWriting()':sec==='speaking'?'runSpeaking()':`runObjective('${sec}')`}">${label(sec)}${done}<br><span class="small">${sectionItems(sec)} items · ${timeText(minutes(sec))}</span></button>`}
function renderOverview(){clearSectionTimer();root(`<div class="card"><h2>${test.name}</h2><p>Recommended order: Reading → Listening → Writing → Speaking.</p><div class="grid">${sectionOrder.map(sectionButton).join('')}</div><div style="margin-top:14px"><button class="secondary" onclick="exportZip()">Export for ChatGPT</button></div></div>`)}
function startSectionTimer(sec){clearSectionTimer();activeSection=sec;let m=minutes(sec);if(!m)return;deadline=Date.now()+m*60000;timer=setInterval(tick,1000)}
function clearSectionTimer(){if(timer)clearInterval(timer);timer=null;deadline=0;activeSection=''}
function tick(){let c=document.getElementById('clock');if(!deadline||!c)return;let left=Math.max(0,deadline-Date.now()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);c.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(left<=0)finishSection('Time is up.')}
function finishSection(msg){saveCurrent();let sec=activeSection;completed[sec]=true;clearSectionTimer();if(msg)alert(msg);renderOverview()}
function saveCurrent(){if(activeSection==='writing')saveWritingFields();if(currentItem&&(['reading','listening'].includes(activeSection)||(activeSection==='writing'&&writingStep==='build'))&&['complete_words','choose_response','daily_life','academic_passage','conversations','announcements','academic_talks','build_sentence'].includes(currentItem.type))saveObjectiveCurrent(false)}

function runObjective(sec){startSectionTimer(sec);secName=sec;seq=[];test.sections[sec].forEach(g=>g.ids.forEach(id=>seq.push([g.type,id])));idx=0;renderObj()}
function renderObj(){if(idx>=seq.length)return finishSection();let [type,id]=seq[idx],it=find(type,id);currentItem={type,id};if(type==='complete_words')return cw(type,it);if(type==='choose_response')return cr(type,it);return mc(type,it)}
function cw(type,it){let n=0,b=it.text.replace(/([A-Za-z]+)(_+)/g,(m,p,u)=>`${p}<input class="blank" id="b${n++}" maxlength="${u.length}" style="width:${Math.max(28,u.length*14)}px">`);root(`<div class="card"><h2>${esc(it.title)}</h2><p style="line-height:2">${b}</p><button onclick="saveObjectiveCurrent(true)">Next</button></div>`)}
function speechBtn(label,text,profile){return `<button class="play" data-speech="${esc(encodeURIComponent(text))}" onclick="speakFromButton(this,'${profile}')">${label}</button>`}
function cr(type,it){root(`<div class="card">${speechBtn('▶ Play once',it.prompt,'choose')}${it.options.map((o,i)=>`<label class="option"><input type="radio" name="x" value="${i}">${esc(o)}</label>`).join('')}<button onclick="saveObjectiveCurrent(true)">Next</button></div>`)}
function mc(type,it){let text=it.text||'',profile=type==='announcements'?'announcement':'lecturer';if(it.turns)text=it.turns.map(t=>t.join(': ')).join('\n');let topAudio=type==='conversations'?`<button class="play" onclick="speakConversation('${it.id}',this)">▶ Play once</button>`:type==='academic_talks'?speechBtn('▶ Play once',text,profile):type==='announcements'?'':`<div class="stim">${esc(text)}</div>`;root(`<div class="card"><h2>${esc(it.title||type)}</h2>${topAudio}${it.questions.map((q,qi)=>`<div>${type==='announcements'?speechBtn('▶ Play question '+(qi+1),text,profile):''}<b>${esc(q.q)}</b>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="q${qi}" value="${i}">${esc(o)}</label>`).join('')}</div>`).join('')}<button onclick="saveObjectiveCurrent(true)">Next</button></div>`)}
function saveObjectiveCurrent(move){if(!currentItem)return;let {type,id}=currentItem,it=find(type,id),s=0,total=itemCount(type,it);if(type==='complete_words')it.answers.forEach((a,i)=>{let el=document.getElementById('b'+i);if(el&&(el.value||'').toLowerCase()===a.toLowerCase())s++});else if(type==='choose_response'){let x=document.querySelector('input[name=x]:checked');s=x&&+x.value===it.answer?1:0}else if(type==='build_sentence'){let chosen=[...document.querySelectorAll('#answerline .chip')].map(x=>x.dataset.part);s=chosen.join('|')===it.parts.join('|')?1:0}else it.questions.forEach((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`);if(x&&+x.value===q.answer)s++});answers.objective[id]={score:s,total};if(move){idx++;renderObj()}}

function runWriting(){startSectionTimer('writing');writingStep='build';secName='writing';seq=test.sections.writing.find(x=>x.type==='build_sentence').ids.map(id=>['build_sentence',id]);idx=0;renderBuild()}
function renderBuild(){if(idx>=seq.length)return renderWritingPrompts();let [type,id]=seq[idx],it=find(type,id);currentItem={type,id};let parts=[...it.parts].reverse();root(`<div class="card"><h2>Build a Sentence</h2><div class="answerline" id="answerline"></div><div class="toolbar">${parts.map(p=>`<button class="chip" onclick="pickPart(this)" data-part="${esc(p)}">${esc(p)}</button>`).join('')}</div><div class="toolbar" style="margin-top:12px"><button class="secondary" onclick="clearBuilt()">Clear</button><button onclick="saveBuildSentence()">Next</button></div></div>`)}
function saveBuildSentence(){saveObjectiveCurrent(false);idx++;renderBuild()}
function pickPart(b){let line=document.getElementById('answerline'),x=document.createElement('button');x.className='chip';x.dataset.part=b.dataset.part;x.textContent=b.dataset.part;x.onclick=()=>{b.disabled=false;x.remove()};line.appendChild(x);b.disabled=true}
function clearBuilt(){document.querySelectorAll('#answerline .chip').forEach(x=>x.remove());document.querySelectorAll('.toolbar .chip').forEach(x=>x.disabled=false)}
function renderWritingPrompts(){currentItem=null;writingStep='prompts';let email=find('email',test.sections.writing.find(x=>x.type==='email').ids[0]),disc=find('discussion',test.sections.writing.find(x=>x.type==='discussion').ids[0]);root(`<div class="card"><h2>Write an Email</h2><div class="stim">${esc(email.prompt)}</div><textarea id="email">${esc(answers.writing.email||'')}</textarea></div><div class="card"><h2>Academic Discussion</h2><div class="stim">${esc(disc.prompt)}</div><textarea id="disc">${esc(answers.writing.discussion||'')}</textarea></div><button onclick="saveWriting()">Save Writing</button>`)}
function saveWritingFields(){let e=document.getElementById('email'),d=document.getElementById('disc');if(e)answers.writing.email=e.value;if(d)answers.writing.discussion=d.value}
function saveWriting(){saveWritingFields();finishSection()}

function runSpeaking(){startSectionTimer('speaking');let reps=test.sections.speaking.find(x=>x.type==='repeat').ids,ints=test.sections.speaking.find(x=>x.type==='interview').ids;root(`<div class="card"><h2>Speaking</h2><p class="muted">Play each prompt once, then record.</p>${reps.map((id,i)=>{let q=find('repeat',id);return `<div class="audio">${speechBtn('▶ Repeat '+(i+1),q.text,'repeat')}<button class="secondary" onclick="record('${id}',12,this)">● Record</button></div>`}).join('')}${ints.map((id,i)=>{let q=find('interview',id);return `<div class="audio">${speechBtn('▶ Interview '+(i+1),q.prompt,'interview')}<button class="secondary" onclick="record('${id}',45,this)">● Record</button></div>`}).join('')}<button onclick="finishSection()">Done</button></div>`)}
async function record(id,sec,b){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let r=new MediaRecorder(stream),chunks=[];r.ondataavailable=e=>chunks.push(e.data);r.onstop=()=>{recordings[id]=new Blob(chunks,{type:'audio/webm'});stream.getTracks().forEach(t=>t.stop());b.textContent='Recorded ✓';b.disabled=true};r.start();b.textContent='Recording…';setTimeout(()=>r.stop(),sec*1000)}catch(e){alert(e.message)}}
function refreshVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));let female=['Ava','Samantha','Allison','Zoe','Susan'],male=['Evan','Aaron','Tom','Daniel'],student=pickVoice(female),staff=pickVoice(male),lecturer=pickVoice(male,[staff]),interview=pickVoice(male,[staff,lecturer]);selectedVoices={studentVoice:student,staffVoice:staff,lecturerVoice:lecturer||staff,announcementVoice:pickVoice([...female,...male]),repeatVoice:pickVoice(female),interviewVoice:interview||pickVoice(male)};console.log('studentVoice',selectedVoices.studentVoice&&selectedVoices.studentVoice.name);console.log('staffVoice',selectedVoices.staffVoice&&selectedVoices.staffVoice.name);console.log('lecturerVoice',selectedVoices.lecturerVoice&&selectedVoices.lecturerVoice.name);console.log('announcementVoice',selectedVoices.announcementVoice&&selectedVoices.announcementVoice.name);console.log('repeatVoice',selectedVoices.repeatVoice&&selectedVoices.repeatVoice.name)}
function pickVoice(names,exclude=[]){let skip=new Set(exclude.filter(Boolean).map(v=>v.name)),us=voices.filter(v=>/en[-_]US/i.test(v.lang)),pool=(us.length?us:voices).filter(v=>!skip.has(v.name));if(!pool.length)pool=us.length?us:voices;let rank=v=>{let i=names.findIndex(n=>v.name.toLowerCase().includes(n.toLowerCase()));return (v.localService?0:100)+(i<0?50:i)};return [...pool].sort((a,b)=>rank(a)-rank(b))[0]||null}
function voiceFor(profile,speaker){if(speaker&&/^student$/i.test(speaker))return selectedVoices.studentVoice;if(speaker&&/(advisor|professor|staff|librarian)/i.test(speaker))return selectedVoices.staffVoice;return ({choose:selectedVoices.announcementVoice,announcement:selectedVoices.announcementVoice,lecturer:selectedVoices.lecturerVoice,repeat:selectedVoices.repeatVoice,interview:selectedVoices.interviewVoice,student:selectedVoices.studentVoice,staff:selectedVoices.staffVoice}[profile])||pickVoice([])}
function rateFor(profile){return {announcement:.98,lecturer:.96,repeat:.98,interview:.98,choose:1,student:.98,staff:.97}[profile]||1}
function setPlayDisabled(disabled,except){document.querySelectorAll('button.play').forEach(x=>{if(x!==except&&!x.dataset.used)x.disabled=disabled})}
function speakFromButton(b,profile='choose'){speak(b.dataset.speech,b,profile)}
function speak(enc,b,profile='choose'){if(b.dataset.used||audioPlaying)return;b.dataset.used=1;b.disabled=true;playUtterance(decodeURIComponent(enc),voiceFor(profile),rateFor(profile),()=>{},()=>{})}
function playUtterance(text,voice,rate,onend,onerror){audioPlaying=true;setPlayDisabled(true);speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;u.onend=()=>{audioPlaying=false;setPlayDisabled(false);onend&&onend()};u.onerror=()=>{audioPlaying=false;setPlayDisabled(false);onerror&&onerror()};speechSynthesis.speak(u)}
function speakConversation(id,b){if(b.dataset.used||audioPlaying)return;b.dataset.used=1;b.disabled=true;let turns=find('conversations',id).turns,i=0;let next=()=>{if(i>=turns.length)return;let [speaker,text]=turns[i++],profile=/^student$/i.test(speaker)?'student':'staff';playUtterance(`${speaker}. ${text}`,voiceFor(profile,speaker),rateFor(profile),next,next)};next()}
function testVoice(b){if(audioPlaying)return;b.disabled=true;playUtterance('This is a natural American English voice test for the TOEFL listening system.',voiceFor('repeat'),rateFor('repeat'),()=>b.disabled=false,()=>b.disabled=false)}
refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices;

function idsFor(sec){return test.sections[sec].flatMap(g=>g.ids)}
function rawFor(ids){return ids.reduce((sum,id)=>sum+(answers.objective[id]?answers.objective[id].score:0),0)}
async function exportZip(){saveCurrent();let zip=new JSZip(),readingIds=idsFor('reading'),listeningIds=idsFor('listening'),buildIds=test.sections.writing.find(x=>x.type==='build_sentence').ids;let obj={test_id:test.id,test_name:test.name,item_counts:Object.fromEntries(sectionOrder.map(s=>[s,sectionItems(s)])),raw_scores:{reading:rawFor(readingIds),listening:rawFor(listeningIds),build_sentence:rawFor(buildIds)},question_ids:Object.fromEntries(sectionOrder.map(s=>[s,idsFor(s)])),durations:test.durations,speaking_files:Object.keys(recordings).map(id=>'speaking/'+id+'.webm'),objective:answers.objective,writing:answers.writing,timestamp:new Date().toISOString()};zip.file('result.json',JSON.stringify(obj,null,2));zip.file('writing/email.txt',answers.writing.email||'');zip.file('writing/academic_discussion.txt',answers.writing.discussion||'');for(let [id,blob] of Object.entries(recordings))zip.file('speaking/'+id+'.webm',blob);let blob=await zip.generateAsync({type:'blob'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=test.id+'_result.zip';a.click()}
</script></body></html>
